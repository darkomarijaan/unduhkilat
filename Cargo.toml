[workspace]
resolver = "2"
members = ["crates/unduhkilat-core", "crates/unduhkilat-host", "crates/unduhkilat-app", "crates/unduhkilat-sign"]

[workspace.package]
version = "0.3.4"
edition = "2021"
license = "UNLICENSED"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Crate milik sendiri dikompilasi paralel: build rilis jauh lebih cepat, dependensi pihak ketiga
# tetap codegen-units = 1 (sudah tersimpan di cache target/release, tidak dikompilasi ulang).
[profile.release.package.unduhkilat-core]
codegen-units = 16

[profile.release.package.unduhkilat-app]
codegen-units = 16
