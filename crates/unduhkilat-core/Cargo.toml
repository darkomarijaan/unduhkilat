[package]
name = "unduhkilat-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
zeroize = "1"
base64 = "0.22"
sha2 = "0.10"
russh = "0.65"
alacritty_terminal = "0.26"
portable-pty = "0.9"
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_Security", "Win32_System_Threading"] }
winreg = "0.56.0"


[dev-dependencies]
rand = "0.10"
